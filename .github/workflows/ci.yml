name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool spawns agent processes and reads git state, so both differ enough per platform
        # to be worth testing on all three rather than assuming.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.x', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Versions
        run: |
          node --version
          git --version

      - name: Test
        run: npm test
